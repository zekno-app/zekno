# Publishes a runner release (specs/005-runner-release/contracts/release.md, "The workflow").
# How to cut one, from start to end: apps/runner/RELEASING.md.
#
# Runs only when a tag `runner-v<version>` is pushed. A dev version (`runner-v0.1.0-dev.1`) must
# be on `dev` and is published as a pre-release, never as the latest release. A prod version
# (`runner-v0.1.0`) must be on `main` and waits for the maintainer's approval in the `prod`
# environment before anything is built or published. Every check is in
# apps/runner/scripts/release.ts, which is tested; this file only runs it. Each release job also
# works out from the tag itself, in its first step, that the tag is of its own kind: it does not
# take the `check` job's word for that, nor for the version or the Bun version.
#
# The release holds the runner for Linux on x86-64 and ARM64 (gzip), SHA256SUMS of the unpacked
# binaries and RELEASE-NOTES.md. It uses no secret beyond the token GitHub gives every workflow,
# and that token may write only in the two release jobs. There, actions/checkout gets it by
# default, to read the repository, and keeps none of it (`persist-credentials: false`); the step
# that publishes gets it to publish. Every install skips the packages' own scripts
# (`--ignore-scripts`). Code that runs earlier in a release job, during the build or in the built
# runner asked for its version, could still reach the publishing step through what GitHub carries
# from one step to the next, such as GITHUB_PATH. Splitting each release job into a build job
# that cannot write and a publish job that runs nothing of the repository waits for the
# maintainer (specs/005-runner-release/research.md, Q11; security-review.md, RV1).
#
# Recording the checksums in apps/cli/src/runner-release.json is not done here: only the
# maintainer's second build writes them, after it built the same files on another machine.
name: runner release

on:
  push:
    tags:
      - "runner-v*"

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: runner-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Which environment, and whether this commit may be released at all. Reads only.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.check.outputs.environment }}
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
      bun: ${{ steps.check.outputs.bun }}
    steps:
      # Actions are pinned to a full commit, so a moved tag cannot change what builds the runner.
      # To update one, read the new release, then change the commit and the version beside it.
      # Every branch is fetched: the check needs to see origin/dev and origin/main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the Bun version
        id: pin
        run: |
          set -euo pipefail
          manager=$(jq -r .packageManager package.json)
          if [[ ! "$manager" =~ ^bun@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The root package.json does not pin a Bun version." >&2
            exit 1
          fi
          echo "bun=${manager#bun@}" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.pin.outputs.bun }}

      # No package's install script runs, here or in the second build (security review RV1).
      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      # The tag reaches the shell only through an environment variable. The script prints its
      # four lines only once every check passed, each held to its pattern.
      - name: Check the tag, the branch and the versions
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: bun apps/runner/scripts/release.ts check --tag "$TAG" >> "$GITHUB_OUTPUT"

  release-dev:
    needs: check
    if: needs.check.outputs.environment == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # First, before anything is checked out, set up or installed: the tag itself must be a dev
      # release's. Bash's own test, in the C locale so that [0-9] means 0 to 9 only. The version
      # it gives is the one published.
      - name: Check that the tag is a dev release's
        id: tag
        env:
          TAG: ${{ github.ref_name }}
          LC_ALL: C
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^runner-v((0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})-dev\.[1-9][0-9]{0,8})$ ]]; then
            echo "This tag is not runner-v<x.y.z>-dev.<n>. This job publishes development releases only." >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the Bun version
        id: pin
        run: |
          set -euo pipefail
          manager=$(jq -r .packageManager package.json)
          if [[ ! "$manager" =~ ^bun@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The root package.json does not pin a Bun version." >&2
            exit 1
          fi
          echo "bun=${manager#bun@}" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.pin.outputs.bun }}

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build for Linux on x86-64 and ARM64
        working-directory: apps/runner
        run: |
          set -euo pipefail
          bun run compile:linux-x64
          bun run compile:linux-arm64

      # The commit is the one `check` passed; `files` stops unless the checkout is that commit.
      - name: Check the runner and write the release's files
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ needs.check.outputs.commit }}
          BUN: ${{ steps.pin.outputs.bun }}
        run: bun apps/runner/scripts/release.ts files --tag "$TAG" --commit "$COMMIT" --bun "$BUN"

      - name: Publish the pre-release
        working-directory: apps/runner/dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          gh --version
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $TAG already exists. A version is released once." >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "zekno-runner $VERSION" --notes-file RELEASE-NOTES.md \
            --prerelease --latest=false \
            zekno-runner-linux-x64.gz zekno-runner-linux-arm64.gz SHA256SUMS RELEASE-NOTES.md

  # Waits for the maintainer's approval in the `prod` environment before its first step. That
  # environment must exist, with its reviewer, before any prod tag is pushed: a workflow that
  # names a missing environment creates it without protection (apps/runner/RELEASING.md).
  release-prod:
    needs: check
    if: needs.check.outputs.environment == 'prod'
    environment: prod
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # First, before anything is checked out, set up or installed: the tag itself must be a prod
      # release's. As in release-dev.
      - name: Check that the tag is a prod release's
        id: tag
        env:
          TAG: ${{ github.ref_name }}
          LC_ALL: C
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^runner-v((0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8}))$ ]]; then
            echo "This tag is not runner-v<x.y.z>. This job publishes prod releases only." >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the Bun version
        id: pin
        run: |
          set -euo pipefail
          manager=$(jq -r .packageManager package.json)
          if [[ ! "$manager" =~ ^bun@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The root package.json does not pin a Bun version." >&2
            exit 1
          fi
          echo "bun=${manager#bun@}" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.pin.outputs.bun }}

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build for Linux on x86-64 and ARM64
        working-directory: apps/runner
        run: |
          set -euo pipefail
          bun run compile:linux-x64
          bun run compile:linux-arm64

      - name: Check the runner and write the release's files
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ needs.check.outputs.commit }}
          BUN: ${{ steps.pin.outputs.bun }}
        run: bun apps/runner/scripts/release.ts files --tag "$TAG" --commit "$COMMIT" --bun "$BUN"

      - name: Publish the release
        working-directory: apps/runner/dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          gh --version
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $TAG already exists. A version is released once." >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "zekno-runner $VERSION" --notes-file RELEASE-NOTES.md \
            zekno-runner-linux-x64.gz zekno-runner-linux-arm64.gz SHA256SUMS RELEASE-NOTES.md
